version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: game_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d game_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    container_name: db_migrator
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:z
    command: ["-path", "/migrations", "-database", "postgresql://root:secret@postgres:5432/game_db?sslmode=disable", "up"]

  api:
    build: .
    container_name: game_api
    ports:
      - "8080:8080"
    environment:
      DB_USER: root
      DB_PASSWORD: secret
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: game_db
      DB_SSLMODE: disable
      SERVER_PORT: 8080
      JWT_SECRET: secret
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
